<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportBuddy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="w-full bg-[#D1D1FF]">  
      <nav>
        <div class="flex items-center justify-between px-4 py-3">
        <div class="text-[#00008F] font-bold leading-[12px] border-[#00008F] border-x-4 bg-white p-3 rounded-lg">
          <p>SPORT<br>BUDDY</p>
        </div>
        <div>
        <ul class="flex items-center gap-5">
          <li><a class="hover:font-bold" href="#">Home</a></li>
          <li><a class=" hover:font-bold" href="#">Contact</a></li>
        </ul>
        </div>
        <div>
        <img class="w-5" src="/src/assets/search-outline.svg">
        </div>
        <div>
          <img class="w-5" src="/src/assets/person-outline.svg">
        </div>
        <button type="button" class="text-sm rounded-lg text-white bg-[#0300bd] hover:bg-white hover:text-black px-3 py-1">Login</button>
        </div>
      </nav>
    </header>
    <main class="text-sm md:text-lg lg:text-2xl">
      <!-- <section class="hero"></section> -->
      <section
        class="flex flex-row items-center justify-center px-4 py-16 md:px-8 bg-[#D1D1FF]>
        <div class="grid grid-cols-2 gap-2 items-center">
          <div class="space-y-5 space-x-5">
            <h1 class="text-3xl md:text-5xl text-[#00008F] font-bold">
              Find your Sports partner
            </h1>
            <p class="font-medium">
              Find your perfect teammate, training buddy, or rival — anytime,
              anywhere.
            </p>
            <button
              class="bg-[#00008F] text-white font-semibold rounded-md px-8 py-3 my-5 md:my-7 hover:bg-gray-200 hover:text-black">
              Sign up
            </button>
          </div>
          <div class="relative flex justify-center">
            <img
              src="./src/assets/football.png"
              alt="football"
              class="rounded-md w-50 md:w-80 lg:w-100"
            />
          </div>
        </div>
      </section>
      <!-- <section class="search-bar"></section> -->
      <!-- <section class="our mission"></section> -->
      <!-- <section class="why-us"></section> -->
      <!-- <section class="popular-sports"></section> -->
      <!-- <section class="reviews"></section> -->
      <!-- <section class="contact-us"></section> -->
    </main>
    <footer></footer>
  </body>
</html>
