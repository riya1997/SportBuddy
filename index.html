<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportBuddy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header></header>
    <main>
      <!-- <section class="hero"></section> -->
      <!-- <section class="search-bar"></section> -->
       <div class="w-full flex items-center justify-center">
       <div class="w-[80%] h-[100px] bg-[#D1D1FF] rounded-lg flex items-center justify-around m-6 ">
       <div class="flex">
        <input type="text" id="location_search" class="bg-white min-w-1/3 max-w-[170px] rounded-l-full text-sm pl-4.5 py-2 placeholder:text-body focus:outline-none" placeholder="Search location.." />
        <span class="w-6 inline-flex items-center bg-white rounded-r-full">
          <img class="w-4"  src="/src/assets/location-outline.svg">
        </span>
        </div>
        <div class="flex">
        <input type="text" id="sports_search" class="bg-white min-w-1/3 max-w-[170px] rounded-l-full text-sm pl-4.5 py-2  placeholder:text-body focus:outline-none" placeholder="Search sports.." />
        <span class="w-6 inline-flex items-center  bg-white  rounded-r-full">
          <img class="w-4"  src="/src/assets/football.svg">
        </span>
        </div>
        <div>
          <button class="bg-[#00008F] text-white text-sm shadow-xs rounded-full w-[70px] px-3.5 py-1.5 hover:bg-[#000051]" type="button">Search</button>
        </div>
      </div>

       </div>
    
      <!-- <section class="our mission"></section> -->

      <!-- <section class="popular-sports"></section> -->

    </main>
    <footer></footer>
  </body>
</html>
