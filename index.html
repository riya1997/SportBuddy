<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportBuddy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header></header>
    <main>

       <div class="w-full flex items-center justify-center">

        <input type="text" id="location_search" class="bg-white min-w-1/3 max-w-[170px] rounded-l-lg text-sm pl-2.5 py-2 shadow-xs placeholder:text-body focus:outline-none" placeholder="Search location.." />

          <img class="w-4"  src="/src/assets/location-outline.svg">
        </span>
        </div>
        <div class="flex">
        <input type="text" id="sports_search" class="bg-white min-w-1/3 max-w-[170px] rounded-l-lg text-sm pl-2.5 py-2 shadow-xs placeholder:text-body focus:outline-none" placeholder="Search sports.." />

          <img class="w-4"  src="/src/assets/football.svg">
        </span>
        </div>
        <div>
          <button class="bg-blue-900 text-white text-sm rounded-lg w-[70px] px-4 py-1.5" type="button">Search</button>
